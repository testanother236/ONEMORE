<template>
    Hello, {greeting}!
    <lightning-input label="Name" value={greeting} onchange={handleChange}></lightning-input>
    <template for:each={contacts} for:item="contact">
        <li key={contact.Id}>
            {contact.Name}, {contact.Title}
        </li>
    </template>
    <template iterator:it={contacts}>
        <li key={it.value.Id}>
            <div if:true={it.first} class="list-first"></div>
            {it.value.Name}, {it.value.Title}
            <div if:true={it.last} class="list-last"></div>
        </li>
    </template>
    <c-todo-item item-name={greeting}></c-todo-item>
    <c-apex-Wire-Method-To-Property></c-apex-Wire-Method-To-Property>
    <c-apex-Wire-Method-With-Params></c-apex-Wire-Method-With-Params>
</template>
