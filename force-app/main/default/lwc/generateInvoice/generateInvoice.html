<template>
    <div class="button-container">
        <lightning-button
            class="custom-button"
            label="Generate Invoice"
            onclick={openModal}
            variant="brand">
        </lightning-button>
    </div>
    <template if:true={isModalOpen}>
        <section class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <div class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-text-heading_medium">Generated Invoice</h2>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <template if:true={isLoading}>
                        <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                    </template>
                    
                    <template if:true={pdfUrl}>
                        <iframe src={pdfUrl} width="100%" height="500px" frameborder="0"></iframe>
                    </template>
                </div>
                <div class="slds-modal__footer footer-container">
                    <lightning-button  variant="neutral" label="Close" onclick={closeModal} class="footer-button neutral-button"></lightning-button>
                        <span class="button-separator"></span>
                    <lightning-button  variant="brand" label="Save" onclick={attachInvoice} class="footer-button brand-button"></lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
